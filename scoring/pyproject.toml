[project]
name = "maple-scoring"
version = "0.1.0"
description = "Server-side pronunciation scoring for Maple"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "praat-parselmouth>=0.4.5",
    "azure-cognitiveservices-speech>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

# Only `app` is the installable package; `spike/` and `tests/` are scripts, not part of it.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
